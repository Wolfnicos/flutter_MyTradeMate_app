name: mytrademate
description: MyTradeMate AI signals demo
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.11.0
  collection: any  # Pentru helper utilities în AI pipeline
  http: ^1.2.2
  dio: ^5.5.0+1
  web_socket_channel: ^2.4.5
  shared_preferences: ^2.2.3
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  intl: ^0.19.0
  url_launcher: ^6.3.0
  # local_auth: ^2.3.0  # Temporarily disabled due to iOS 'local_auth_darwin' module issue
  archive: ^3.6.1
  path_provider: ^2.1.4
  image: ^4.3.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
  dart_code_metrics: ^4.19.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # include toate modelele și meta din director
    - assets/models/
    # imaginile (inclusiv chart_probe.png)
    - assets/images/
    # config runtime (include tot directorul)
    - assets/config/
